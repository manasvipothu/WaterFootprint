<!DOCTYPE html>

<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <title> Glassmorphism Website | CodingLab </title>
    <link rel="stylesheet" href="mainlanding.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap"
        rel="stylesheet">
    
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <style>
      
      .heading {
            font-family: "Cinzel Decorative", serif;
            font-weight: 550;
            font-style: normal;
            font-size: 200px;
            padding: 0px 84px;
            position: relative;
            left: 230px;
            top: 100px;
           color: rgb(225, 231, 231);
            cursor: default;
        }

        .heading span {
            display: inline-block;
            opacity: 0;
            animation: revealLetter 3s ease-out forwards;
        }

        .heading span:nth-child(1) {
            animation-delay: 0.1s;
        }

        .heading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .heading span:nth-child(3) {
            animation-delay: 0.3s;
        }

        .heading span:nth-child(4) {
            animation-delay: 0.4s;
        }

        .heading span:nth-child(5) {
            animation-delay: 0.5s;
        }

        /* .heading span:nth-child(6) { animation-delay: 0.6s; } */
        /* .heading span:nth-child(7) { animation-delay: 0.7s; }
        .heading span:nth-child(8) { animation-delay: 0.8s; }
        .heading span:nth-child(9) { animation-delay: 0.9s; } */
        @keyframes revealLetter {
            0% {
                clip-path: inset(0 50% 0 50%);
                opacity: 0;
            }

            50% {
                clip-path: inset(0 0 0 0);
                opacity: 1;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>
<body>
  <header>
    <!-- <nav class="navbar">
      <div class="logo"><a href="#">LOGO></a></div>
      <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Latest</a></li>
        <li><a href="#">Offers</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
     
    </nav> -->
    <div class="page-content-wrapper" id="pageContentWrapper"></div>
    <!-- <h1 class="heading">E</h1> -->
    <h1 class="heading"><span>W</span><span>A</span><span>T</span><span>E</span><span>R</span></h1>
    <div class="h5" id="animate">
       
    </div>
    <div class="transition-overlay" id="transitionOverlay"></div>
    <div class="text-content">
      <h2>FOOTPRINT<br></h2>


      
      <p>
        "Every drop counts: Discover the hidden water footprint behind everyday choices and take a step toward a more sustainable future."</p>
    </div> 
    <button onclick="location.href='dasboard.html'" class="button">Explore</button>
  </header>
  <script>
    window.addEventListener('load', function () {
        const pageContentWrapper = document.getElementById('pageContentWrapper');
        const transitionOverlay = document.getElementById('transitionOverlay');


        setTimeout(function () {
            transitionOverlay.classList.add('hide');
            pageContentWrapper.classList.add('show');
        }, 500);
    });
    const button = document.querySelector(".button");
      button.addEventListener("click", (e) => {
        e.preventDefault;
        button.classList.add("animate");
        setTimeout(() => {
          button.classList.remove("animate");
        }, 600);
      });
</script>
</body>
</html>
